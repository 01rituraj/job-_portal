<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Job Portal</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body>

    <!-- Navbar -->
    <header>
        <div class="logo">Job <span>Portal</span></div>
        <nav>
            <a href="#">Home</a>
            <a href="#">Browse</a>
            <a href="#">Jobs</a>
            <a href="#">About</a>
        </nav>
        <div class="auth">
            <button class="login">Login</button>
            <button class="register">Register</button>
        </div>
    </header>

    <!-- Hero Section -->
    <section class="hero">
        <p class="badge">No.1 Job Hunt Website</p>
        <h1>Search Apply & <br> Get Your <span>Dream Job</span></h1>
        <p class="subtext">
            Start your hunt for the best, life-changing career opportunities
        </p>

        <div class="search-box">
            <input type="text" placeholder="Find your dream job">
            <button>
                  <i class="fa-brands fa-sistrix"></i>
            </button>
        </div>
    </section>

    <!-- Categories -->
    <section class="categories">
        <h2>Categories</h2>
        <p>Explore our extensive job market.</p>

        <div class="category-list">
            <button>Frontend Developer</button>
            <button>Backend Developer</button>
        </div>
    </section>

    <!-- Loader -->
    <div class="loader"></div>

    <!-- Footer -->
    <footer>
        <p>© 2026. All rights reserved.</p>
        <p>Powered by Ritu raj kumar</p>
        <p>
            <a href="#">Privacy Policy</a> |
            <a href="#">Terms of Service</a>
        </p>
    </footer>

</body>

</html>
